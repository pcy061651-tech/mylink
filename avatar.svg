<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffd1a4"/>
      <stop offset="100%" stop-color="#f5ba82"/>
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="clothGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- 원형 배경 (모던 그라디언트) -->
  <circle cx="100" cy="100" r="100" fill="url(#bgGrad)"/>

  <!-- 안쪽 부드러운 림 라이트 -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>

  <!-- 몸체 / 옷 -->
  <path d="M45 200 C45 155, 75 140, 100 140 C125 140, 155 155, 155 200 Z" fill="url(#clothGrad)" filter="url(#shadow)"/>
  
  <!-- 목 -->
  <path d="M85 125 L115 125 L115 148 L85 148 Z" fill="#f5ba82"/>

  <!-- 얼굴 -->
  <ellipse cx="100" cy="98" rx="36" ry="42" fill="url(#skinGrad)" filter="url(#shadow)"/>

  <!-- 귀 -->
  <circle cx="62" cy="100" r="9" fill="#f5ba82"/>
  <circle cx="138" cy="100" r="9" fill="#f5ba82"/>

  <!-- 눈 -->
  <ellipse cx="86" cy="96" rx="4" ry="5" fill="#1e1b4b"/>
  <ellipse cx="114" cy="96" rx="4" ry="5" fill="#1e1b4b"/>
  <circle cx="85" cy="94" r="1.5" fill="#ffffff"/>
  <circle cx="113" cy="94" r="1.5" fill="#ffffff"/>

  <!-- 눈썹 -->
  <path d="M80 86 Q87 83 93 86" fill="none" stroke="#1e1b4b" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M107 86 Q113 83 120 86" fill="none" stroke="#1e1b4b" stroke-width="2.5" stroke-linecap="round"/>

  <!-- 미소 -->
  <path d="M92 114 Q100 122 108 114" fill="none" stroke="#d97706" stroke-width="2.5" stroke-linecap="round"/>

  <!-- 볼터치 -->
  <circle cx="78" cy="106" r="6" fill="#f43f5e" opacity="0.25"/>
  <circle cx="122" cy="106" r="6" fill="#f43f5e" opacity="0.25"/>

  <!-- 헤어 스타일 -->
  <path d="M64 85 C64 55, 80 44, 100 44 C124 44, 136 55, 136 85 C136 90, 135 98, 133 100 C130 92, 126 80, 115 76 C105 72, 92 78, 80 74 C72 71, 68 85, 67 98 C65 92, 64 88, 64 85 Z" fill="url(#hairGrad)"/>

  <!-- 안경 (스마트한 개발자 느낌의 골드/블랙 메탈 라운드 안경) -->
  <circle cx="86" cy="96" r="13" fill="none" stroke="#312e81" stroke-width="2.5"/>
  <circle cx="114" cy="96" r="13" fill="none" stroke="#312e81" stroke-width="2.5"/>
  <line x1="99" y1="96" x2="101" y2="96" stroke="#312e81" stroke-width="2.5"/>
  <line x1="73" y1="96" x2="64" y2="92" stroke="#312e81" stroke-width="2.5"/>
  <line x1="127" y1="96" x2="136" y2="92" stroke="#312e81" stroke-width="2.5"/>
</svg>
